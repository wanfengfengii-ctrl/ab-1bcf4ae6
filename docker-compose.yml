services:
  web:
    build: .
    ports:
      # 宿主机端口可通过 WEB_PORT 环境变量配置，默认 8080
      - "${WEB_PORT:-8080}:5000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health',timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  verify:
    build: .
    command: ["python", "verify.py"]
    environment:
      WEB_BASE: http://web:5000
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
